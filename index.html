<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>OnePoint Time Clock Mock</title>
<style>
:root{--bg:#f7f8fb;--surface:#fff;--ink:#15171c;--muted:#6f7582;--line:#e6e8ed;--nav:#11131a;--nav2:#1b1f2a;--accent:#2f6fed;--accent-soft:#edf3ff;--ok:#19734a;--warn:#a26009;--danger:#b42318;--shadow:0 8px 28px rgba(25,35,60,.08)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:242px 1fr}.sidebar{background:linear-gradient(180deg,var(--nav),#0d1016);color:#fff;padding:22px 14px;display:flex;flex-direction:column}.logo{padding:4px 10px 22px;font-size:19px;font-weight:780;letter-spacing:-.02em}.logo span{display:block;color:#9299a8;font-size:12px;font-weight:500;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c5cad4;border-radius:10px;padding:11px 12px;text-align:left;transition:.15s}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.sidebar-foot{margin-top:auto;border:1px solid #2e3441;border-radius:13px;padding:12px;color:#bdc3cf}.sidebar-foot strong{color:white;display:block;margin-bottom:2px}.main{min-width:0}.topbar{height:76px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.eyebrow{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.09em}.topbar h1{font-size:22px;margin:4px 0 0;letter-spacing:-.02em}.top-user{text-align:right}.content{padding:26px;max-width:1500px;margin:0 auto}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.015)}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:28px;font-weight:780;margin:8px 0 3px;letter-spacing:-.025em}.metric .sub{color:var(--muted);font-size:11px}.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-head h2{font-size:17px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.btn{border-radius:9px;padding:9px 13px;font-weight:700;border:0;min-height:38px}.primary{background:var(--accent);color:white}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff1f0;color:var(--danger);border:1px solid #ffd3cf}.muted{color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:750;background:#f2f3f5;color:#565c67}.badge.ok{background:#eaf7f0;color:var(--ok)}.badge.warn{background:#fff6e7;color:var(--warn)}.badge.blue{background:var(--accent-soft);color:var(--accent)}.filters{display:grid;grid-template-columns:1.05fr 1fr 1.25fr 1.25fr 1fr auto auto;gap:9px;align-items:end}.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 10px;outline:none}.field input:focus,.field select:focus{border-color:#9ab8f8;box-shadow:0 0 0 3px #edf3ff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-size:12px}th{background:#fafbfc;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:1}tbody tr:hover{background:#fcfdff}.editable{cursor:text}.editable:hover{background:var(--accent-soft)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:11px}.summary .item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}.summary span{display:block;color:var(--muted);font-size:11px}.summary strong{display:block;font-size:17px;margin-top:4px}.list{display:grid;gap:9px}.row-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.row-left{display:flex;align-items:center;gap:11px}.initial{width:34px;height:34px;border-radius:9px;background:#f0f3f9;display:grid;place-items:center;font-size:11px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.store-card{border:1px solid var(--line);border-radius:13px;padding:15px;background:white}.store-card .store-top{display:flex;justify-content:space-between;gap:10px}.store-card h3{margin:0 0 4px}.logic{margin-top:11px;padding:9px 10px;background:#f8f9fb;border-radius:9px;font-size:12px}.kiosk-screen{max-width:720px;margin:72px auto;background:white;border:1px solid var(--line);border-radius:28px;padding:52px 56px;box-shadow:var(--shadow);text-align:center}.clock-brand{font-size:16px;color:var(--muted);font-weight:700;letter-spacing:.04em}.clock-time{font-size:56px;font-weight:800;margin:20px 0 6px}.clock-date{font-size:16px;color:var(--muted);margin-bottom:32px}.kiosk-screen .field{max-width:560px;margin:0 auto 12px}.kiosk-screen input{width:100%;height:64px;border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:21px;margin-top:10px}.clock-btn{width:100%;max-width:560px;height:68px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:22px;font-weight:800;margin:18px auto 0;display:block}.clock-btn.out{background:#111827}.notice{padding:13px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13px;border:1px solid #fed7aa}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,94vw);background:#fff;z-index:30;box-shadow:-12px 0 40px rgba(0,0,0,.15);padding:24px;overflow:auto}.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:20}.hidden{display:none!important}.drawer h2{margin-top:0}.drawer .field{margin-bottom:12px}.drawer .actions{margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;z-index:40;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}.inline-editor{display:flex;gap:6px;align-items:center}.inline-editor input{height:34px;border:1px solid #93c5fd;border-radius:7px;padding:0 7px}.row-expand{background:#fafafa}.audit{font-size:12px;display:grid;gap:5px}.danger-text{color:var(--danger)}@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:auto;padding:16px}.content{padding:14px}.grid4,.filters,.summary{grid-template-columns:1fr}.top-user{display:none}.kiosk-screen{margin:18px auto;padding:30px 20px}.clock-time{font-size:44px}.kiosk-screen input{height:58px}.clock-btn{height:62px}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar"><div class="logo">OnePoint<span>Time & Attendance</span></div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><strong>Free Plan</strong><div>6 locations</div><small>Upgrade recommended</small></div></aside>
<section class="main"><header class="topbar"><div><div class="eyebrow">OWNER DASHBOARD</div><h1 id="pageTitle">Overview</h1></div><div class="top-user"><strong>Krishna Retail Group</strong><div class="muted">Owner</div></div></header><main class="content" id="content"></main></section>
</div>
<div id="backdrop" class="backdrop hidden"></div><aside id="drawer" class="drawer hidden"></aside><div id="toast" class="toast"></div>
<script>
(()=>{
const root=document,nav=root.getElementById('nav'),content=root.getElementById('content'),title=root.getElementById('pageTitle');
const state={route:'overview',expanded:null,employees:[
{id:'1047',name:'Jackie Smith',stores:['DFW1','DFW2'],primary:'DFW1',job:'Cashier',payType:'hourly',rate:16,status:'Active',pin:'1234'},
{id:'1051',name:'Kevin Jones',stores:['DFW2'],primary:'DFW2',job:null,payType:null,rate:null,status:'Active',pin:'2222'},
{id:'1063',name:'Maria Lopez',stores:['DFW1','DFW3'],primary:'DFW3',job:'Manager',payType:'monthly',rate:4500,status:'Active',pin:'3333'},
{id:'1090',name:'Andre Cole',stores:['DFW3'],primary:'DFW3',job:'Cashier',payType:'hourly',rate:16,status:'Inactive',pin:'4444'}],
stores:[
{id:'DFW1',name:'DFW1',policy:'dfw',tz:'America/Chicago',open:'09:00',close:'22:00'},
{id:'DFW2',name:'DFW2',policy:'generic',tz:'America/Chicago',open:'09:00',close:'23:00'},
{id:'DFW3',name:'DFW3',policy:'dfw',tz:'America/Chicago',open:'10:00',close:'21:00'},
{id:'DFW4',name:'DFW4',policy:'generic',tz:'America/Chicago',open:'09:00',close:'22:00'},
{id:'DFW5',name:'DFW5',policy:'dfw',tz:'America/Chicago',open:'09:00',close:'22:00'},
{id:'DFW6',name:'DFW6',policy:'generic',tz:'America/Chicago',open:'09:00',close:'22:00'}],
jobs:[{id:'CASH',name:'Cashier',type:'hourly',rate:16},{id:'MGR',name:'Manager',type:'monthly',rate:4500}],
entries:[
{id:1,emp:'1047',store:'DFW1',job:'Cashier',actualIn:'2026-09-01T08:42',actualOut:'2026-09-01T17:05',payIn:'2026-09-01T09:00',payOut:'2026-09-01T17:05',edited:false,void:false},
{id:2,emp:'1047',store:'DFW2',job:'Cashier',actualIn:'2026-09-02T10:03',actualOut:'2026-09-02T18:11',payIn:'2026-09-02T10:03',payOut:'2026-09-02T18:11',edited:false,void:false},
{id:3,emp:'1051',store:'DFW2',job:null,actualIn:'2026-09-01T09:08',actualOut:'2026-09-01T17:02',payIn:'2026-09-01T09:08',payOut:'2026-09-01T17:02',edited:false,void:false},
{id:4,emp:'1063',store:'DFW3',job:'Manager',actualIn:'2026-09-01T09:45',actualOut:'2026-09-01T21:22',payIn:'2026-09-01T10:00',payOut:'2026-09-01T21:00',edited:false,void:false},
{id:5,emp:'1047',store:'DFW1',job:'Cashier',actualIn:'2026-09-03T10:17',actualOut:'2026-09-03T17:03',payIn:'2026-09-03T10:17',payOut:'2026-09-03T17:03',edited:false,void:false}],
audit:[],kiosk:{active:true,store:'DFW1',openEmp:null},plan:'Free'};
const navItems=[['overview','Overview'],['timesheets','Timesheets & Payroll'],['employees','Employees'],['stores','Stores'],['jobs','Job Codes'],['kiosks','Time Clock Kiosks'],['audit','Audit Log'],['account','Account & Plan'],['admin','Admin Mock'],['clock','Employee Time Clock']];
nav.innerHTML=navItems.map(([r,l])=>`<button data-route="${r}">${l}</button>`).join('');nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.route=b.dataset.route;render()});
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0)}
function fmt(v){return v?new Date(v).toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit',hour:'numeric',minute:'2-digit'}):'—'}
function minutes(e){if(!e.payOut||e.void)return 0;return Math.max(0,Math.round((new Date(e.payOut)-new Date(e.payIn))/60000))}
function emp(id){return state.employees.find(x=>x.id===id)}
function wage(e){const m=minutes(e),p=emp(e.emp);if(!p||!p.payType||p.rate==null||p.rate==='')return 0;if(p.payType==='monthly')return 0;return m/60*Number(p.rate)}
function setActive(){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.route===state.route))}
function render(){setActive();const map={overview:overview,timesheets:timesheets,employees:employees,stores:stores,jobs:jobs,kiosks:kiosks,audit:audit,account:account,admin:admin,clock:clock};title.textContent=state.route==='clock'?'Employee Time Clock':navItems.find(x=>x[0]===state.route)?.[1]||'OnePoint';content.innerHTML='';map[state.route]();}
function metric(label,value,sub=''){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function overview(){const active=state.entries.filter(e=>!e.actualOut&&!e.void).length;const today=state.entries.filter(e=>e.actualIn.startsWith('2026-09-03'));const hrs=today.reduce((a,e)=>a+minutes(e)/60,0);const payroll=today.reduce((a,e)=>a+wage(e),0);content.innerHTML=`<div class="grid4">${metric('Currently Clocked In',active,'Across all locations')}${metric("Today's Hours",hrs.toFixed(1),'Payable hours')}${metric('Estimated Payroll Today',money(payroll),'Configured pay only')}${metric('Open / Missing Punches','2','Needs review')}</div><section class="section card"><div class="section-head"><div><h2>Employees Currently Working</h2><p>Mock live status across owner locations</p></div><span class="badge blue">6 locations</span></div><div class="list"><div class="row-card"><div class="row-left"><div class="initial">JS</div><div><strong>Jackie Smith</strong><div class="muted">DFW1 · Clocked in 10:17 AM</div></div></div><span class="badge ok">Clocked In</span></div><div class="row-card"><div class="row-left"><div class="initial">KJ</div><div><strong>Kevin Jones</strong><div class="muted">DFW2 · Clocked in 9:08 AM</div></div></div><span class="badge ok">Clocked In</span></div></div></section><section class="section card"><div class="section-head"><div><h2>Store Labor Snapshot</h2><p>Separate payroll visibility by store while employee totals remain consolidated</p></div></div>${state.stores.slice(0,4).map((s,i)=>`<div class="row-card"><div><strong>${s.name}</strong><div class="muted">${s.policy==='dfw'?'DFW Logic':'Generic Logic'}</div></div><div><strong>${[31.4,22.6,18.1,12.8][i]} hrs</strong><div class="muted">${money([487.23,361.44,289.60,198.40][i])}</div></div></div>`).join('')}</section>`}
function filtersHTML(){return `<div class="filters"><div class="field"><label>Employee</label><select id="fEmp"><option value="">All Employees</option>${state.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></div><div class="field"><label>Store</label><select id="fStore"><option value="">All Stores</option>${state.stores.map(s=>`<option>${s.id}</option>`).join('')}</select></div><div class="field"><label>Start Date & Time</label><input id="fStart" type="datetime-local" value="2026-09-01T00:00"></div><div class="field"><label>End Date & Time</label><input id="fEnd" type="datetime-local" value="2026-09-15T23:59"></div><div class="field"><label>Job Code</label><select id="fJob"><option value="">All Job Codes</option><option value="none">No Job Code</option>${state.jobs.map(j=>`<option value="${j.name}">${j.name}</option>`).join('')}</select></div><button class="btn primary" id="applyFilters">Apply</button><button class="btn secondary" id="exportCsv">Export CSV</button></div>`}
function timesheets(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>Timesheets & Payroll</h2><p>Double-click Clock In or Clock Out to edit date/time. All Employees is selected by default.</p></div><span class="badge warn">Mock Data</span></div>${filtersHTML()}<div id="tsResults" class="section"></div></section>`;root.getElementById('applyFilters').addEventListener('click',renderTimesheetRows);root.getElementById('exportCsv').addEventListener('click',exportCsv);renderTimesheetRows();}
function selectedEntries(){const fe=root.getElementById('fEmp')?.value||'',fs=root.getElementById('fStore')?.value||'',fj=root.getElementById('fJob')?.value||'',st=root.getElementById('fStart')?.value||'',en=root.getElementById('fEnd')?.value||'';return state.entries.filter(e=>!e.void&&(!fe||e.emp===fe)&&(!fs||e.store===fs)&&(!fj||(fj==='none'?!e.job:e.job===fj))&&(!st||e.actualIn>=st)&&(!en||e.actualIn<=en));}
function renderTimesheetRows(){const rows=selectedEntries();const hourly=rows.reduce((a,e)=>a+wage(e),0),mins=rows.reduce((a,e)=>a+minutes(e),0),monthlyIds=[...new Set(rows.map(e=>e.emp).filter(id=>emp(id)?.payType==='monthly'&&emp(id)?.rate!=null))],monthly=monthlyIds.reduce((a,id)=>a+Number(emp(id).rate),0);const el=root.getElementById('tsResults');el.innerHTML=`<div class="table-wrap"><table><thead><tr><th></th><th>ID</th><th>Employee</th><th>Location</th><th>Job Code</th><th>Clock In</th><th>Clock Out</th><th>Minutes</th><th>Hours</th><th>Pay Type</th><th>Rate</th><th>Wages</th><th>Status</th></tr></thead><tbody>${rows.map(e=>rowHTML(e)).join('')}</tbody></table></div><div class="summary"><div class="item"><span>Employees</span><strong>${new Set(rows.map(e=>e.emp)).size}</strong></div><div class="item"><span>Shifts</span><strong>${rows.length}</strong></div><div class="item"><span>Total Hours</span><strong>${(mins/60).toFixed(2)}</strong></div><div class="item"><span>Hourly Payroll</span><strong>${money(hourly)}</strong></div><div class="item"><span>Total Payroll</span><strong>${money(hourly+monthly)}</strong></div></div>`;el.querySelectorAll('.expandBtn').forEach(b=>b.addEventListener('click',()=>{state.expanded=state.expanded===+b.dataset.id?null:+b.dataset.id;renderTimesheetRows()}));el.querySelectorAll('.editable').forEach(c=>c.addEventListener('dblclick',()=>editCell(c,+c.dataset.id,c.dataset.field)));}
function rowHTML(e){const p=emp(e.emp),expanded=state.expanded===e.id;return `<tr><td><button class="btn secondary expandBtn" data-id="${e.id}" style="padding:4px 8px;min-height:28px">${expanded?'−':'+'}</button></td><td>${e.id}</td><td><strong>${p?.name||'Unknown'}</strong><div class="muted">${p?.id||''}</div></td><td>${e.store}</td><td>${e.job||'—'}</td><td class="editable" data-id="${e.id}" data-field="actualIn">${fmt(e.actualIn)}</td><td class="editable" data-id="${e.id}" data-field="actualOut">${fmt(e.actualOut)}</td><td>${minutes(e)}</td><td>${(minutes(e)/60).toFixed(2)}</td><td>${p?.payType||'—'}</td><td>${p?.payType&&p?.rate!=null?(p.payType==='monthly'?money(p.rate)+'/mo':money(p.rate)+'/hr'):'—'}</td><td>${p?.payType&&p?.rate!=null?(p.payType==='monthly'?'Monthly salary':money(wage(e))):'—'}</td><td><span class="badge ${e.edited?'warn':'ok'}">${e.edited?'Edited':'Recorded'}</span></td></tr>${expanded?`<tr class="row-expand"><td></td><td colspan="12"><div class="audit"><strong>Shift details</strong><span>Actual: ${fmt(e.actualIn)} → ${fmt(e.actualOut)}</span><span>Payable: ${fmt(e.payIn)} → ${fmt(e.payOut)}</span><span>Policy: ${state.stores.find(s=>s.id===e.store)?.policy==='dfw'?'DFW Logic':'Generic Logic'}</span><div style="margin-top:6px"><button class="btn secondary" data-void="${e.id}" disabled>Void Entry (mock)</button> <button class="btn secondary" disabled>Change Job Code (mock)</button></div></div></td></tr>`:''}`}
function editCell(cell,id,field){const e=state.entries.find(x=>x.id===id),old=e[field];cell.innerHTML=`<div class="inline-editor"><input type="datetime-local" value="${old||''}"><button class="btn primary save">Save</button><button class="btn secondary cancel">×</button></div>`;const inp=cell.querySelector('input');inp.focus();cell.querySelector('.cancel').onclick=renderTimesheetRows;cell.querySelector('.save').onclick=()=>{const v=inp.value;if(!v)return alert('Select date and time');const reason=prompt('Reason for time adjustment','Employee forgot to clock in on time');if(reason===null)return renderTimesheetRows();e[field]=v;e.edited=true;recomputePayable(e);state.audit.unshift({entry:e.id,employee:emp(e.emp)?.name,field,old,new:v,reason,editor:'Owner / Manager',when:new Date().toISOString()});showToast('Time updated and payroll recalculated');renderTimesheetRows();}}
function recomputePayable(e){const s=state.stores.find(x=>x.id===e.store);if(!s)return;if(s.policy==='generic'){e.payIn=e.actualIn;e.payOut=e.actualOut;return}const day=e.actualIn?.slice(0,10);if(!day)return;const open=day+'T'+s.open,close=day+'T'+s.close;e.payIn=e.actualIn<open?open:e.actualIn;if(e.actualOut)e.payOut=e.actualOut>close?close:e.actualOut;}
function exportCsv(){const rows=selectedEntries(),head=['Entry ID','Employee ID','Employee Name','Location','Job Code','Actual Clock In','Actual Clock Out','Payable Clock In','Payable Clock Out','Minutes','Hours','Pay Type','Rate','Wages','Edited'];const data=rows.map(e=>{const p=emp(e.emp);return[e.id,p?.id,p?.name,e.store,e.job||'',e.actualIn,e.actualOut,e.payIn,e.payOut,minutes(e),(minutes(e)/60).toFixed(2),p?.payType||'',p?.rate??'',p?.payType&&p?.rate!=null?(p.payType==='monthly'?'MONTHLY':wage(e).toFixed(2)):'',e.edited?'Yes':'No']});const csv=[head,...data].map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='onepoint-timesheet.csv';a.click();URL.revokeObjectURL(a.href);showToast('Timesheet CSV exported')}
function employees(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>Employees</h2><p>Manage employee access and store assignments. Pay and job code are optional.</p></div><button class="btn primary" id="addEmp">+ Add Employee</button></div><div class="list">${state.employees.map(e=>`<div class="row-card"><div class="row-left"><div class="initial">${e.name.split(' ').map(x=>x[0]).join('').slice(0,2)}</div><div><strong>${e.name}</strong><div class="muted">ID ${e.id} · ${e.stores.join(', ')}${e.job?' · '+e.job:''}</div></div></div><div><span class="badge ${e.status==='Active'?'ok':''}">${e.status}</span></div></div>`).join('')}</div></section>`;root.getElementById('addEmp').addEventListener('click',()=>openDrawer(`<h2>Add Employee</h2><div class="field"><label>Name</label><input id="dName" placeholder="Employee name"></div><div class="field"><label>Employee ID</label><input id="dId" value="${1100+state.employees.length}"></div><div class="field"><label>PIN</label><input id="dPin" type="password" placeholder="4–8 digits"></div><div class="field"><label>Primary Store</label><select id="dStore">${state.stores.map(s=>`<option>${s.id}</option>`).join('')}</select></div><div class="field"><label>Job Code (optional)</label><select id="dJob"><option value="">None</option>${state.jobs.map(j=>`<option>${j.name}</option>`).join('')}</select></div><div class="field"><label>Pay Type (optional)</label><select id="dType"><option value="">No pay rate</option><option value="hourly">Hourly</option><option value="monthly">Monthly</option></select></div><div class="field"><label>Pay Amount (optional)</label><input id="dRate" type="number" min="0" step="0.01" placeholder="Leave blank if not used"></div><div class="actions"><button class="btn primary" id="saveEmp">Create Employee</button><button class="btn secondary" id="cancelEmp">Cancel</button></div>`));setTimeout(()=>{root.getElementById('saveEmp').onclick=()=>{const name=root.getElementById('dName').value.trim();if(!name)return alert('Enter employee name');state.employees.push({id:root.getElementById('dId').value,name,stores:[root.getElementById('dStore').value],primary:root.getElementById('dStore').value,job:root.getElementById('dJob').value||null,payType:root.getElementById('dType').value||null,rate:root.getElementById('dRate').value===''?null:Number(root.getElementById('dRate').value),status:'Active',pin:root.getElementById('dPin').value||'0000'});closeDrawer();showToast('Employee created');employees()};root.getElementById('cancelEmp').onclick=closeDrawer},0)}
function stores(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>Stores</h2><p>Each store can independently use DFW Logic or Generic Logic.</p></div><button class="btn primary" id="addStore">+ Add Store</button></div><div class="two">${state.stores.map(s=>`<div class="store-card"><div class="store-top"><div><h3>${s.id}</h3><div class="muted">${s.tz}</div></div><span class="badge blue">${s.policy==='dfw'?'DFW Logic':'Generic Logic'}</span></div><div class="logic">Hours: ${s.open} – ${s.close}</div></div>`).join('')}</div><p class="notice section">Free Plan · ${state.stores.length} locations. Additional locations remain available during onboarding; upgrading is recommended but not required in this mock.</p></section>`;root.getElementById('addStore').onclick=()=>{const n='DFW'+(state.stores.length+1);state.stores.push({id:n,name:n,policy:'generic',tz:'America/Chicago',open:'09:00',close:'22:00'});showToast(n+' added');stores()}}
function jobs(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>Job Codes</h2><p>Optional. Create only when the owner wants job-based pay.</p></div><button class="btn primary" id="addJob">+ Create Job Code</button></div><div class="list">${state.jobs.map(j=>`<div class="row-card"><div><strong>${j.name}</strong><div class="muted">${j.type==='hourly'?'Hourly':'Monthly'}</div></div><strong>${j.type==='hourly'?money(j.rate)+'/hr':money(j.rate)+'/month'}</strong></div>`).join('')}</div></section>`;root.getElementById('addJob').onclick=()=>{const name=prompt('Job code name','Inventory');if(!name)return;const type=confirm('OK = Hourly, Cancel = Monthly')?'hourly':'monthly';const rate=Number(prompt('Pay amount',type==='hourly'?'18':'4000'))||0;state.jobs.push({id:name.toUpperCase().slice(0,8),name,type,rate});showToast('Job code created');jobs()}}
function kiosks(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>Time Clock Kiosks</h2><p>Management activates a POS browser without leaving management permissions signed in.</p></div><button class="btn primary" id="openClock">Open Employee Clock</button></div><div class="row-card"><div><strong>${state.kiosk.store} POS Time Clock</strong><div class="muted">Long-lived, revocable kiosk authorization</div></div><span class="badge ok">Active</span></div><div class="section notice">If authorization is lost, management can reactivate with password or a single-use emailed 6-digit code. Production OTP will be server-side and expiring.</div></section>`;root.getElementById('openClock').onclick=()=>{state.route='clock';render()}}
function audit(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>Audit Log</h2><p>Manual time changes preserve original and corrected values.</p></div></div><div class="list">${state.audit.length?state.audit.map(a=>`<div class="row-card"><div><strong>${a.employee} · Entry #${a.entry}</strong><div class="muted">${a.field==='actualIn'?'Clock In':'Clock Out'}: ${fmt(a.old)} → ${fmt(a.new)}</div><div class="muted">${a.reason}</div></div><span class="badge warn">${a.editor}</span></div>`).join(''):`<div class="muted">No time adjustments yet. Double-click a Clock In or Clock Out field in Timesheets to test it.</div>`}</div></section>`}
function account(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>Account & Plan</h2><p>Plan belongs to the owner/tenant account.</p></div><span class="badge blue">${state.plan}</span></div><div class="two"><div class="store-card"><div class="muted">Current Plan</div><h3>${state.plan}</h3><p class="muted">${state.stores.length} locations</p></div><div class="store-card"><div class="muted">Tenant Isolation</div><h3>Enabled by design</h3><p class="muted">Production access will be enforced with Supabase RLS.</p></div></div></section>`}
function admin(){content.innerHTML=`<section class="card"><div class="section-head"><div><h2>OnePoint Admin Mock</h2><p>Platform Admin onboards owners and assigns Free or Paid.</p></div></div><div class="table-wrap"><table><thead><tr><th>Owner</th><th>Business</th><th>Plan</th><th>Stores</th><th>Employees</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td>Krishna</td><td>Krishna Retail Group</td><td><select id="planSelect"><option>Free</option><option>Paid</option></select></td><td>${state.stores.length}</td><td>${state.employees.length}</td><td><span class="badge ok">Active</span></td><td><button class="btn primary" id="savePlan">Save Plan</button></td></tr><tr><td>Sample Owner</td><td>Sample Markets</td><td>Paid</td><td>12</td><td>38</td><td><span class="badge ok">Active</span></td><td><button class="btn secondary" disabled>Mock</button></td></tr></tbody></table></div></section>`;root.getElementById('savePlan').onclick=()=>showToast(`Plan set to ${root.getElementById('planSelect').value}`)}
function clock(){nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));const now=new Date();content.innerHTML=`<div class="kiosk-screen"><div class="clock-brand">ONEPOINT TIME CLOCK · ${state.kiosk.store}</div><div class="clock-time" id="clockNow">${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div><div class="clock-date">${now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>${state.kiosk.openEmp?clockAction():`<div class="field"><label style="text-align:left">Employee ID</label><input id="clockId" inputmode="numeric" placeholder="Employee ID"></div><div class="field"><label style="text-align:left;margin-top:10px">PIN</label><input id="clockPin" type="password" inputmode="numeric" placeholder="PIN"></div><button class="clock-btn" id="clockContinue">Continue</button><p class="muted">Employees cannot backdate or manually enter missed times.</p>`}</div>`;if(state.kiosk.openEmp){root.getElementById('punchBtn').onclick=()=>{const p=emp(state.kiosk.openEmp);const existing=state.entries.find(e=>e.emp===p.id&&!e.actualOut&&!e.void);if(existing){existing.actualOut='2026-09-03T17:05';existing.payOut=existing.actualOut;state.kiosk.openEmp=null;showToast('Clock out recorded');clock()}else{state.entries.push({id:Math.max(...state.entries.map(e=>e.id))+1,emp:p.id,store:state.kiosk.store,job:p.job,actualIn:'2026-09-03T10:17',actualOut:null,payIn:'2026-09-03T10:17',payOut:null,edited:false,void:false});state.kiosk.openEmp=null;showToast('Clock in recorded');clock()}}}else{root.getElementById('clockContinue').onclick=()=>{const id=root.getElementById('clockId').value.trim(),pin=root.getElementById('clockPin').value.trim(),p=state.employees.find(e=>e.id===id&&e.pin===pin&&e.status==='Active');if(!p)return alert('Mock login failed. Try Jackie: ID 1047 / PIN 1234');state.kiosk.openEmp=p.id;clock()}}}
function clockAction(){const p=emp(state.kiosk.openEmp),open=state.entries.find(e=>e.emp===p.id&&!e.actualOut&&!e.void);return `<div class="card" style="box-shadow:none"><h2>${p.name}</h2><p class="muted">${open?`Clocked in at ${fmt(open.actualIn)}`:'Currently clocked out'}</p><button class="clock-btn ${open?'out':''}" id="punchBtn">${open?'CLOCK OUT':'CLOCK IN'}</button></div>`}
function openDrawer(html){root.getElementById('drawer').innerHTML=html;root.getElementById('drawer').classList.remove('hidden');root.getElementById('backdrop').classList.remove('hidden')}
function closeDrawer(){root.getElementById('drawer').classList.add('hidden');root.getElementById('backdrop').classList.add('hidden')}
root.getElementById('backdrop').onclick=closeDrawer;
function showToast(t){const el=root.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
render();
})();
</script>
</body>
</html>
