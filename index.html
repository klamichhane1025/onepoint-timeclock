<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OnePoint Time Clock Mock</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#151820;--muted:#6b7280;--line:#e5e7eb;--nav:#111827;--blue:#2563eb;--ok:#15803d;--warn:#b45309}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:20px 14px;display:flex;flex-direction:column}.brand{padding:5px 8px 18px;font-size:18px;font-weight:800}.brand small{display:block;color:#9ca3af;font-size:12px;font-weight:500;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:10px}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.plan{margin-top:auto;border:1px solid #334155;border-radius:12px;padding:12px;color:#cbd5e1}.plan b{display:block;color:#fff}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:20px 26px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.top small{color:var(--muted)}.content{padding:24px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;font-size:27px;margin:8px 0 3px}.section{margin-top:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.head h2{margin:0;font-size:17px}.muted{color:var(--muted);font-size:12px}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.filters{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.2fr 1fr auto auto;gap:9px;align-items:end}.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 9px;background:#fff}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1050px;background:#fff}th,td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-size:12px}th{background:#fafafa;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.edit:hover{background:#eff6ff}.badge{display:inline-block;border-radius:99px;padding:4px 7px;font-size:10px;font-weight:800;background:#f3f4f6}.ok{background:#ecfdf5;color:var(--ok)}.warn{background:#fff7ed;color:var(--warn)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.summary div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}.summary span{color:var(--muted);font-size:11px}.summary b{display:block;font-size:17px;margin-top:4px}.list{display:grid;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.clock{max-width:500px;margin:36px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center}.clock h2{font-size:30px;margin:12px 0 4px}.clock input{width:100%;height:50px;border:1px solid var(--line);border-radius:11px;padding:0 12px;margin-top:8px}.clock button{width:100%;height:55px;margin-top:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:800}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,94vw);background:#fff;padding:22px;z-index:30;box-shadow:-10px 0 30px #0002;overflow:auto}.back{position:fixed;inset:0;background:#0005;z-index:20}.hidden{display:none}.drawer .field{margin:11px 0}.actions{display:flex;gap:8px;margin-top:15px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:11px 14px;border-radius:9px;opacity:0;transition:.2s;z-index:40}.toast.show{opacity:1}@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr 1fr}}@media(max-width:720px){.app{grid-template-columns:1fr}.cards,.filters,.summary,.two{grid-template-columns:1fr}.content{padding:14px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">OnePoint<small>Time & Attendance</small></div><nav class="nav" id="nav"></nav><div class="plan"><b>Free Plan</b>6 locations · upgrade recommended</div></aside><section class="main"><header class="top"><div><small>OWNER DASHBOARD</small><h1 id="title">Overview</h1></div><div><b>Krishna Retail Group</b><div class="muted">Owner</div></div></header><main class="content" id="content"></main></section></div><div class="back hidden" id="back"></div><aside class="drawer hidden" id="drawer"></aside><div class="toast" id="toast"></div>
<script>
(()=>{const $=s=>document.querySelector(s),S={route:'overview',employees:[{id:'1047',name:'Jackie Smith',stores:['DFW1','DFW2'],job:'Cashier',type:'hourly',rate:16,pin:'1234'},{id:'1051',name:'Kevin Jones',stores:['DFW2'],job:null,type:'hourly',rate:15.5,pin:'2222'},{id:'1063',name:'Maria Lopez',stores:['DFW1','DFW3'],job:'Manager',type:'monthly',rate:4500,pin:'3333'}],stores:[{id:'DFW1',logic:'DFW Logic',open:'09:00',close:'22:00'},{id:'DFW2',logic:'Generic Logic',open:'09:00',close:'23:00'},{id:'DFW3',logic:'DFW Logic',open:'10:00',close:'21:00'},{id:'DFW4',logic:'Generic Logic',open:'09:00',close:'22:00'},{id:'DFW5',logic:'DFW Logic',open:'09:00',close:'22:00'},{id:'DFW6',logic:'Generic Logic',open:'09:00',close:'22:00'}],jobs:[{name:'Cashier',type:'hourly',rate:16},{name:'Manager',type:'monthly',rate:4500}],entries:[{id:1,emp:'1047',store:'DFW1',job:'Cashier',ai:'2026-09-01T08:42',ao:'2026-09-01T17:05',pi:'2026-09-01T09:00',po:'2026-09-01T17:05',edited:false},{id:2,emp:'1047',store:'DFW2',job:'Cashier',ai:'2026-09-02T10:03',ao:'2026-09-02T18:11',pi:'2026-09-02T10:03',po:'2026-09-02T18:11',edited:false},{id:3,emp:'1051',store:'DFW2',job:null,ai:'2026-09-01T09:08',ao:'2026-09-01T17:02',pi:'2026-09-01T09:08',po:'2026-09-01T17:02',edited:false},{id:4,emp:'1063',store:'DFW3',job:'Manager',ai:'2026-09-01T09:45',ao:'2026-09-01T21:22',pi:'2026-09-01T10:00',po:'2026-09-01T21:00',edited:false},{id:5,emp:'1047',store:'DFW1',job:'Cashier',ai:'2026-09-03T10:17',ao:'2026-09-03T17:03',pi:'2026-09-03T10:17',po:'2026-09-03T17:03',edited:false}],audit:[],clockEmp:null};
const nav=[['overview','Overview'],['timesheets','Timesheets & Payroll'],['employees','Employees'],['stores','Stores'],['jobs','Job Codes'],['kiosk','Employee Time Clock'],['audit','Audit Log'],['admin','Admin Mock']];$('#nav').innerHTML=nav.map(x=>`<button data-r="${x[0]}">${x[1]}</button>`).join('');$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){S.route=b.dataset.r;render()}};const emp=id=>S.employees.find(x=>x.id===id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0),fmt=v=>v?new Date(v).toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit',hour:'numeric',minute:'2-digit'}):'—',mins=e=>e.po?Math.max(0,Math.round((new Date(e.po)-new Date(e.pi))/60000)):0,wage=e=>emp(e.emp).type==='monthly'?0:mins(e)/60*emp(e.emp).rate;
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1600)}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.r===S.route));$('#title').textContent=nav.find(x=>x[0]===S.route)?.[1]||'OnePoint';({overview,timesheets,employees,stores,jobs,kiosk,audit,admin}[S.route]||overview)()}
function overview(){$('#content').innerHTML=`<div class="cards"><div class="card metric"><span>Currently Clocked In</span><b>2</b><small class="muted">Across all locations</small></div><div class="card metric"><span>Today's Hours</span><b>64.2</b><small class="muted">Payable hours</small></div><div class="card metric"><span>Estimated Payroll Today</span><b>$1,024.87</b><small class="muted">Hourly payroll</small></div><div class="card metric"><span>Open / Missing Punches</span><b>2</b><small class="muted">Needs review</small></div></div><div class="card section"><div class="head"><div><h2>Store Labor Snapshot</h2><div class="muted">Employee totals consolidate across stores while store payroll stays separate.</div></div></div><div class="list">${S.stores.slice(0,4).map((s,i)=>`<div class="row"><div><b>${s.id}</b><div class="muted">${s.logic}</div></div><div><b>${[31.4,22.6,18.1,12.8][i]} hrs</b><div class="muted">${money([487.23,361.44,289.6,198.4][i])}</div></div></div>`).join('')}</div></div>`}
function timesheets(){$('#content').innerHTML=`<div class="card"><div class="head"><div><h2>Timesheets & Payroll</h2><div class="muted">Double-click Clock In or Clock Out to edit date and time.</div></div><span class="badge warn">Mock data</span></div><div class="filters"><div class="field"><label>Employee</label><select id="fe"><option value="">All Employees</option>${S.employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}</select></div><div class="field"><label>Store</label><select id="fs"><option value="">All Stores</option>${S.stores.map(s=>`<option>${s.id}</option>`).join('')}</select></div><div class="field"><label>Start Date & Time</label><input id="fstart" type="datetime-local" value="2026-09-01T00:00"></div><div class="field"><label>End Date & Time</label><input id="fend" type="datetime-local" value="2026-09-15T23:59"></div><div class="field"><label>Job Code</label><select id="fj"><option value="">All Job Codes</option><option value="none">No Job Code</option>${S.jobs.map(j=>`<option>${j.name}</option>`).join('')}</select></div><button class="btn primary" id="apply">Apply</button><button class="btn secondary" id="csv">Export CSV</button></div><div id="rows" class="section"></div></div>`;$('#apply').onclick=rows;$('#csv').onclick=csv;rows()}
function chosen(){let a=$('#fe')?.value||'',b=$('#fs')?.value||'',j=$('#fj')?.value||'',s=$('#fstart')?.value||'',z=$('#fend')?.value||'';return S.entries.filter(e=>(!a||e.emp===a)&&(!b||e.store===b)&&(!j||(j==='none'?!e.job:e.job===j))&&(!s||e.ai>=s)&&(!z||e.ai<=z))}
function rows(){const r=chosen(),m=r.reduce((a,e)=>a+mins(e),0),h=r.reduce((a,e)=>a+wage(e),0),monthly=[...new Set(r.filter(e=>emp(e.emp).type==='monthly').map(e=>e.emp))].reduce((a,id)=>a+emp(id).rate,0);$('#rows').innerHTML=`<div class="table"><table><thead><tr><th>ID</th><th>Employee</th><th>Store</th><th>Job Code</th><th>Clock In</th><th>Clock Out</th><th>Minutes</th><th>Hours</th><th>Pay Type</th><th>Rate</th><th>Wages</th><th>Status</th></tr></thead><tbody>${r.map(e=>{let p=emp(e.emp);return`<tr><td>${e.id}</td><td><b>${p.name}</b><div class="muted">${p.id}</div></td><td>${e.store}</td><td>${e.job||'—'}</td><td class="edit" data-id="${e.id}" data-f="ai">${fmt(e.ai)}</td><td class="edit" data-id="${e.id}" data-f="ao">${fmt(e.ao)}</td><td>${mins(e)}</td><td>${(mins(e)/60).toFixed(2)}</td><td>${p.type}</td><td>${p.type==='monthly'?money(p.rate)+'/mo':money(p.rate)+'/hr'}</td><td>${p.type==='monthly'?'Monthly salary':money(wage(e))}</td><td><span class="badge ${e.edited?'warn':'ok'}">${e.edited?'Edited':'Recorded'}</span></td></tr>`}).join('')}</tbody></table></div><div class="summary"><div><span>Employees</span><b>${new Set(r.map(e=>e.emp)).size}</b></div><div><span>Shifts</span><b>${r.length}</b></div><div><span>Total Hours</span><b>${(m/60).toFixed(2)}</b></div><div><span>Hourly Payroll</span><b>${money(h)}</b></div><div><span>Total Payroll</span><b>${money(h+monthly)}</b></div></div>`;document.querySelectorAll('.edit').forEach(c=>c.ondblclick=()=>editTime(c,+c.dataset.id,c.dataset.f))}
function editTime(c,id,f){let e=S.entries.find(x=>x.id===id),old=e[f];c.innerHTML=`<input type="datetime-local" value="${old}" style="height:32px"><button class="btn primary" style="padding:5px 7px">Save</button>`;c.querySelector('button').onclick=()=>{let v=c.querySelector('input').value;if(!v)return;let reason=prompt('Reason for adjustment','Employee forgot to clock in on time');if(reason===null)return rows();e[f]=v;e.edited=true;let st=S.stores.find(x=>x.id===e.store);if(st.logic==='Generic Logic'){f==='ai'?e.pi=v:e.po=v}else{let d=e.ai.slice(0,10),op=d+'T'+st.open,cl=d+'T'+st.close;e.pi=e.ai<op?op:e.ai;if(e.ao)e.po=e.ao>cl?cl:e.ao}S.audit.unshift({entry:id,field:f,old,new:v,reason});toast('Time updated');rows()}}
function csv(){let head=['Entry ID','Employee ID','Employee Name','Store','Job Code','Actual Clock In','Actual Clock Out','Payable Clock In','Payable Clock Out','Minutes','Hours','Rate','Wages'];let data=chosen().map(e=>{let p=emp(e.emp);return[e.id,p.id,p.name,e.store,e.job||'',e.ai,e.ao,e.pi,e.po,mins(e),(mins(e)/60).toFixed(2),p.rate,p.type==='monthly'?'MONTHLY':wage(e).toFixed(2)]});let txt=[head,...data].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='onepoint-timesheet.csv';a.click();toast('CSV exported')}
function drawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.remove('hidden');$('#back').classList.remove('hidden')}function close(){ $('#drawer').classList.add('hidden');$('#back').classList.add('hidden')}$('#back').onclick=close;
function employees(){$('#content').innerHTML=`<div class="card"><div class="head"><div><h2>Employees</h2><div class="muted">Employees may work across multiple owner stores. Job code is optional.</div></div><button class="btn primary" id="addEmp">+ Add Employee</button></div><div class="list">${S.employees.map(e=>`<div class="row"><div><b>${e.name}</b><div class="muted">ID ${e.id} · ${e.stores.join(', ')} · ${e.job||'No Job Code'}</div></div><div><b>${e.type==='monthly'?money(e.rate)+'/mo':money(e.rate)+'/hr'}</b></div></div>`).join('')}</div></div>`;$('#addEmp').onclick=()=>{drawer(`<h2>Add Employee</h2><div class="field"><label>Name</label><input id="dn"></div><div class="field"><label>Employee ID</label><input id="di" value="${1100+S.employees.length}"></div><div class="field"><label>PIN</label><input id="dp" type="password"></div><div class="field"><label>Primary Store</label><select id="ds">${S.stores.map(s=>`<option>${s.id}</option>`).join('')}</select></div><div class="field"><label>Job Code (optional)</label><select id="dj"><option value="">None</option>${S.jobs.map(j=>`<option>${j.name}</option>`).join('')}</select></div><div class="field"><label>Pay Type</label><select id="dt"><option value="hourly">Hourly</option><option value="monthly">Monthly</option></select></div><div class="field"><label>Pay Amount</label><input id="dr" type="number" value="15"></div><div class="actions"><button class="btn primary" id="save">Create</button><button class="btn secondary" id="cancel">Cancel</button></div>`);$('#save').onclick=()=>{let n=$('#dn').value.trim();if(!n)return alert('Enter name');S.employees.push({id:$('#di').value,name:n,stores:[$('#ds').value],job:$('#dj').value||null,type:$('#dt').value,rate:+$('#dr').value||0,pin:$('#dp').value||'0000'});close();employees();toast('Employee created')};$('#cancel').onclick=close}}
function stores(){$('#content').innerHTML=`<div class="card"><div class="head"><div><h2>Stores</h2><div class="muted">Free owners can onboard beyond 4 stores; show upgrade messaging without blocking.</div></div><button class="btn primary" id="addStore">+ Add Store</button></div><div class="two">${S.stores.map(s=>`<div class="row"><div><b>${s.id}</b><div class="muted">${s.open}–${s.close}</div></div><span class="badge">${s.logic}</span></div>`).join('')}</div></div>`;$('#addStore').onclick=()=>{let id='DFW'+(S.stores.length+1);S.stores.push({id,logic:'Generic Logic',open:'09:00',close:'22:00'});stores();toast(id+' added on Free plan')}}
function jobs(){$('#content').innerHTML=`<div class="card"><div class="head"><div><h2>Job Codes</h2><div class="muted">Optional. A job code can carry hourly or monthly pay.</div></div><button class="btn primary" id="addJob">+ Create Job Code</button></div><div class="list">${S.jobs.map(j=>`<div class="row"><b>${j.name}</b><b>${j.type==='hourly'?money(j.rate)+'/hr':money(j.rate)+'/month'}</b></div>`).join('')}</div></div>`;$('#addJob').onclick=()=>{let n=prompt('Job code name','Inventory');if(!n)return;let t=confirm('OK = hourly, Cancel = monthly')?'hourly':'monthly',r=+prompt('Pay amount',t==='hourly'?'18':'4000');S.jobs.push({name:n,type:t,rate:r||0});jobs();toast('Job code created')}}
function kiosk(){$('#content').innerHTML=`<div class="clock"><div class="muted">ONEPOINT TIME CLOCK · DFW1</div><h2>${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</h2><div class="muted">Employees cannot backdate missed punches.</div>${S.clockEmp?clockAction():`<input id="cid" placeholder="Employee ID"><input id="pin" type="password" placeholder="PIN"><button id="cont">Continue</button><p class="muted">Try Jackie: 1047 / 1234</p>`}</div>`;if(S.clockEmp){$('#punch').onclick=()=>{S.clockEmp=null;toast('Mock punch recorded');kiosk()}}else $('#cont').onclick=()=>{let e=S.employees.find(x=>x.id===$('#cid').value&&x.pin===$('#pin').value);if(!e)return alert('Invalid mock ID/PIN. Try 1047 / 1234');S.clockEmp=e.id;kiosk()}}
function clockAction(){let e=emp(S.clockEmp),open=S.entries.find(x=>x.emp===e.id&&!x.ao);return`<div class="section"><h3>${e.name}</h3><p class="muted">${open?'Currently clocked in':'Currently clocked out'}</p><button id="punch">${open?'CLOCK OUT':'CLOCK IN'}</button></div>`}
function audit(){$('#content').innerHTML=`<div class="card"><div class="head"><div><h2>Audit Log</h2><div class="muted">Original values are retained for manager corrections.</div></div></div><div class="list">${S.audit.length?S.audit.map(a=>`<div class="row"><div><b>Entry #${a.entry} · ${a.field==='ai'?'Clock In':'Clock Out'}</b><div class="muted">${fmt(a.old)} → ${fmt(a.new)} · ${a.reason}</div></div><span class="badge warn">Edited</span></div>`).join(''):'<div class="muted">No edits yet. Double-click a time in Timesheets.</div>'}</div></div>`}
function admin(){$('#content').innerHTML=`<div class="card"><div class="head"><div><h2>OnePoint Admin Mock</h2><div class="muted">Admin controls Free/Paid plan assignment per owner account.</div></div></div><div class="table"><table><thead><tr><th>Owner</th><th>Business</th><th>Plan</th><th>Stores</th><th>Employees</th><th>Status</th></tr></thead><tbody><tr><td>Krishna</td><td>Krishna Retail Group</td><td><select><option>Free</option><option>Paid</option></select></td><td>${S.stores.length}</td><td>${S.employees.length}</td><td><span class="badge ok">Active</span></td></tr></tbody></table></div></div>`}
render()})();
</script></body></html>
