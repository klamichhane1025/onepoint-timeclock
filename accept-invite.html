<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accept OnePoint Invitation</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/puppertino-platform.css?v=20260914-1"><style>.invitePage{min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(0,113,227,.08),transparent 34%),#f5f5f7;display:grid;place-items:center;padding:24px}.inviteCard{width:min(460px,94vw);background:rgba(255,255,255,.92);border:1px solid rgba(60,60,67,.14);border-radius:22px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.09);backdrop-filter:blur(24px)}.inviteMark{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#0071e3,#58a6ff);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800;margin-bottom:20px;box-shadow:0 7px 18px rgba(0,113,227,.2)}.inviteBrand{font-size:25px;font-weight:750;letter-spacing:-.035em;color:#1d1d1f}.inviteBrand small{display:block;font-size:12px;font-weight:500;color:#6e6e73;letter-spacing:0;margin-top:3px}.inviteCard h1{font-size:28px;letter-spacing:-.04em;margin:24px 0 8px}.inviteCard p{color:#6e6e73;line-height:1.55;font-size:13px}.inviteActions{display:grid;gap:8px;margin-top:18px}.passwordHint{font-size:11px;color:#86868b;margin-top:6px}.statusLine{display:none;margin-top:13px;padding:11px 12px;border-radius:11px;font-size:12px}.statusLine.show{display:block}.statusLine.error{background:#fff2f2;color:#b42318}.statusLine.success{background:#ecfdf3;color:#166534}</style></head><body><main class="invitePage"><section class="inviteCard"><div class="inviteMark">1</div><div class="inviteBrand">OnePoint<small>Time & Attendance</small></div><h1>Set your password</h1><p>Complete your invitation by creating a secure password. This link is single-use and expires automatically.</p><div class="field section"><label>New password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 10 characters"><div class="passwordHint">Use 10+ characters. A mix of letters, numbers, and symbols is recommended.</div></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><div class="inviteActions"><button class="btn primary" id="acceptInvite">Accept Invitation</button><a class="btn secondary" href="/">Cancel</a></div><div id="inviteStatus" class="statusLine"></div></section></main><script src="/pin-visibility.js?v=20260914-3"></script><script src="/accept-invite.js"></script></body></html>
