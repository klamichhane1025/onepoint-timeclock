<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accept OnePoint Invitation</title><link rel="stylesheet" href="/styles.css"><style>.invitePage{min-height:100vh;background:#f5f7fb;display:grid;place-items:center;padding:24px}.inviteCard{width:min(520px,94vw);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:34px;box-shadow:0 28px 80px rgba(15,23,42,.12)}.inviteBrand{font-size:28px;font-weight:800;letter-spacing:-.7px;color:#0f172a}.inviteBrand small{display:block;font-size:13px;font-weight:500;color:#64748b;letter-spacing:0;margin-top:4px}.inviteCard h1{font-size:28px;margin:28px 0 8px}.inviteCard p{color:#64748b;line-height:1.55}.inviteActions{display:grid;gap:10px;margin-top:20px}.passwordHint{font-size:12px;color:#94a3b8;margin-top:7px}.statusLine{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:13px}.statusLine.show{display:block}.statusLine.error{background:#fef2f2;color:#991b1b}.statusLine.success{background:#ecfdf5;color:#166534}</style></head><body><main class="invitePage"><section class="inviteCard"><div class="inviteBrand">OnePoint<small>Time & Attendance</small></div><h1>Set your password</h1><p>Complete your OnePoint invitation by creating a secure password. This link is single-use and expires automatically.</p><div class="field section"><label>New password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 10 characters"><div class="passwordHint">Use 10+ characters. A mix of letters, numbers, and symbols is recommended.</div></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password"></div><div class="inviteActions"><button class="btn primary" id="acceptInvite">Accept Invitation</button><a class="btn secondary" href="/">Cancel</a></div><div id="inviteStatus" class="statusLine"></div></section></main><script src="/accept-invite.js"></script></body></html>
