name: Build Windows Widget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-widget/**'
      - '.github/workflows/build-windows-widget.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: windows-widget/package-lock.json

      - name: Install dependencies
        working-directory: windows-widget
        run: npm install

      - name: Build Windows installer
        working-directory: windows-widget
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePoint-Time-Clock-Widget-Windows
          path: windows-widget/dist/*.exe
          if-no-files-found: error
          retention-days: 30
