<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Accept Invitation | OnePoint Time Clock</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/enterprise-theme-v2.css">
  <link rel="stylesheet" href="/puppertino-platform.css?v=20260914-1">
  <style>
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(0,113,227,.08),transparent 34%),#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;color:#1d1d1f}
    .inviteCard{width:min(460px,100%);background:rgba(255,255,255,.92);border:1px solid rgba(60,60,67,.14);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.09);padding:30px;backdrop-filter:blur(24px)}
    .inviteMark{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#0071e3,#58a6ff);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800;margin-bottom:22px;box-shadow:0 7px 18px rgba(0,113,227,.2)}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.11em;color:#6e6e73;margin-bottom:7px}h1{margin:0 0 8px;font-size:28px;line-height:1.15;letter-spacing:-.04em}.muted{color:#6e6e73;line-height:1.55;font-size:13px}.field{margin-top:16px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:#515154}.field input{width:100%;box-sizing:border-box;min-height:42px;padding:0 11px;border:1px solid rgba(60,60,67,.22);border-radius:10px;font:inherit;background:#fff}.field input:focus{outline:none;border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.12)}.actions{display:flex;gap:8px;margin-top:20px}.btn{min-height:40px;border-radius:10px;padding:0 15px;font-size:13px;font-weight:700;cursor:pointer}.btn.primary{background:#0071e3;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:14px;padding:11px 12px;border-radius:10px;display:none;font-size:12px}.msg.error{display:block;background:#fff2f2;color:#b42318;border:1px solid rgba(215,0,21,.15)}.msg.success{display:block;background:#ecfdf3;color:#166534;border:1px solid rgba(22,128,61,.15)}
  </style>
</head>
<body>
  <main class="inviteCard">
    <div class="inviteMark">1</div>
    <div class="eyebrow">ONEPOINT TIME CLOCK</div>
    <h1>Set your password</h1>
    <p class="muted">Create your password to activate your account and securely enter your OnePoint workspace.</p>
    <div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="10" placeholder="At least 10 characters"></div>
    <div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="10" placeholder="Re-enter password"></div>
    <div class="actions"><button class="btn primary" id="acceptBtn">Accept Invitation</button></div>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </main>
<script>
(()=>{
  const SUPABASE_URL='https://eomgnaulupqiwjzcimqt.supabase.co';
  const KEY='sb_publishable_p20lJcecq2HN7trRTDMW8Q_iCYVnQsM';
  const $=s=>document.querySelector(s),msg=$('#msg'),btn=$('#acceptBtn');
  const token=new URLSearchParams(location.search).get('token')||'';
  function show(text,type='error'){msg.textContent=text;msg.className='msg '+type}
  if(!token){show('This invitation link is invalid. Please ask your administrator to resend the setup email.');btn.disabled=true;return}
  btn.addEventListener('click',async()=>{
    const password=$('#password').value,confirm=$('#confirm').value;
    if(password.length<10)return show('Use a password with at least 10 characters.');
    if(password!==confirm)return show('The passwords do not match.');
    btn.disabled=true;const old=btn.textContent;btn.textContent='Activating…';
    try{
      const r=await fetch(`${SUPABASE_URL}/functions/v1/account-access`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action:'accept_invitation',token,password})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok||d.error)throw new Error(d.error||'Unable to activate this account.');
      show('Account activated. Redirecting to sign in…','success');
      const portal=d.portal==='/manager'?'/manager/':'/owner/';
      setTimeout(()=>location.replace(portal),700);
    }catch(e){show(e?.message||String(e));btn.disabled=false;btn.textContent=old}
  });
})();
</script>
</body>
</html>
